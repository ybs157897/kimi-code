name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Smoke test CLI bundle
        run: pnpm -C apps/kimi-code run smoke
      - name: Smoke test Klient memory runtime
        run: pnpm --filter @moonshot-ai/klient run smoke

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test --shard=${{ matrix.shard }}/5

  # pi-tui's suite runs on node:test (not vitest), so the root `pnpm run test`
  # does not execute it; it needs its own job.
  test-pi-tui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moonshot-ai/pi-tui test

  test-windows:
    runs-on: windows-latest
    # Temporarily disabled while Windows tests are being stabilized.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: pnpm run test -- --testTimeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run sherif
      - run: pnpm run check:legacy-agent-core-refs

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm dlx --package @typescript/native-preview@beta tsgo --version
          for config in packages/*/tsconfig.json apps/kimi-code/tsconfig.json; do
            echo "Typechecking ${config}"
            pnpm dlx --package @typescript/native-preview@beta tsgo -p "${config}" --noEmit
          done
      - name: Typecheck VS Code extension
        run: pnpm --filter kimi-code run typecheck
      - name: Typecheck kimi-web (vue-tsc)
        run: pnpm --filter @moonshot-ai/kimi-web run typecheck
      - name: Typecheck vis-server
        run: pnpm --filter @moonshot-ai/vis-server run typecheck
      - name: Typecheck vis-web
        run: pnpm --filter @moonshot-ai/vis-web run typecheck

  smoke-klient-docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run credential-free Klient Docker E2E
        run: bash packages/klient/scripts/run-docker-e2e.sh
        env:
          KIMI_SERVER_E2E_CREDENTIAL_FREE: "1"
          KIMI_SERVER_E2E_STATE_ROOT: ${{ runner.temp }}/kimi-server-e2e

  smoke-vscode-extension-host:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Package Linux VSIX
        run: pnpm --filter kimi-code run package:platform -- --target linux-x64
      - name: Cache VS Code Extension Host
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kimi-vscode-test-cache
          key: vscode-extension-host-1.100.0-${{ runner.os }}-${{ runner.arch }}
      - name: Smoke test installed VSIX
        run: xvfb-run -a pnpm --filter kimi-code run test:extension-host -- --version 1.100.0
        env:
          VSCODE_TEST_CACHE: ${{ runner.temp }}/kimi-vscode-test-cache
